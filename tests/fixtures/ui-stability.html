<!doctype html>
<html lang="en"><meta charset="utf-8"><title>UI stability regression</title>
<link rel="stylesheet" href="/src/styles.css">
<div id="app" class="app-shell"></div>
<script type="module">
import { h, render } from 'preact';
import { useState } from 'preact/hooks';
import { api } from '/src/api/client.ts';
import { MediaCatalog } from '/src/screens/MediaCatalog.tsx';
import { LiveTV } from '/src/screens/LiveTV.tsx';
import { Settings } from '/src/screens/Settings.tsx';
import { listenToRemote } from '/src/platform/remote.ts';
import { useFocusManager } from '/src/navigation/FocusContext.tsx';

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const root = document.getElementById('app');
const check = (value, message) => { if (!value) throw new Error(message); };
let focus;
function Harness({ kind }) {
  focus = useFocusManager();
  const [query, setQuery] = useState({ category: '', search: '', offset: 0 });
  return h(kind === 'live' ? LiveTV : MediaCatalog, { kind, query, setQuery, open() {}, play() {}, guide() {} });
}

async function run() {
  const reports = [];
  for (const kind of ['live', 'movies', 'series']) {
    const counts = { catalogs: 0, windows: 0, blur: 0, inputHandlerMs: 0, maxCards: 0 };
    const channels = Array.from({ length: 8726 }, (_, i) => ({ id: String(i), name: `1234567890 Channel ${i}`, categoryId: 'cat' }));
    let arrive;
    api.liveCatalog = () => { counts.catalogs++; return new Promise(resolve => { arrive = () => resolve(channels); }); };
    api.liveCategories = api.vodCategories = api.seriesCategories = async () => [{ id: 'cat', name: 'Category' }];
    api.favorites = async () => [];
    api.epg = async () => ({ status: 'empty', progress: 0 });
    const windowPage = async (_category, offset = 0, term = '') => {
      counts.windows++;
      const items = Array.from({ length: 120 }, (_, i) => ({ id: String(offset + i), name: `1234567890 Item ${offset + i}`, categoryId: 'cat' }));
      return { items: term === 'absent' ? [] : items, offset, total: term === 'absent' ? 0 : 43534, limit: 120 };
    };
    api.movieWindow = api.seriesWindow = windowPage;
    render(h(Harness, { kind, key: kind }), root);
    await wait(100);
    const input = root.querySelector('input'), header = root.querySelector('header');
    check(root.querySelectorAll('.search-hint .remote-key svg').length === 2, `${kind}: missing search remote icons`);
    check(!root.textContent.includes('{key_'), `${kind}: untranslated remote hint tokens`);
    focus.focus(`${kind}:search`); focus.select();
    input.addEventListener('blur', () => counts.blur++);
    const type = async term => {
      input.value = term; input.setSelectionRange(term.length, term.length);
      const start = performance.now();
      input.dispatchEvent(new Event('input', { bubbles: true }));
      counts.inputHandlerMs += performance.now() - start;
      if (arrive) { arrive(); arrive = undefined; }
      await wait(kind === 'live' ? 30 : 290);
      check(root.querySelector('input') === input && root.querySelector('header') === header, `${kind}: interactive controls replaced`);
      check(document.activeElement === input, `${kind}: input lost focus for length ${term.length}`);
      check(input.value === term && input.selectionStart === term.length, `${kind}: editing state changed`);
      counts.maxCards = Math.max(counts.maxCards, root.querySelectorAll('.movie-card, .channel-row').length);
    };
    for (let length = 1; length <= 10; length++) await type('1234567890'.slice(0, length));
    for (const term of ['123456789', '123', 'absent', '']) await type(term);
    check(counts.blur === 0, `${kind}: unexpected blur`);
    const viewport = root.querySelector(kind === 'live' ? '.channel-list' : '.movies-grid');
    const row = kind === 'live' ? parseFloat(getComputedStyle(document.documentElement).fontSize) * 4 : parseFloat(viewport.style.getPropertyValue('--movie-row'));
    const budget = (Math.ceil(viewport.clientHeight / row) + (kind === 'live' ? 5 : 3)) * (kind === 'live' ? 1 : 6);
    check(counts.maxCards <= budget, `${kind}: virtualization exceeded budget (${counts.maxCards}/${budget})`);
    await type('123');
    const back = new KeyboardEvent('keydown', { key: 'Backspace', keyCode: 8, bubbles: true, cancelable: true });
    input.dispatchEvent(back);
    check(back.defaultPrevented && input.value === '123', `${kind}: controller Back would delete search text`);
    check(document.activeElement === input.parentElement, `${kind}: controller Back did not exit editing`);
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }));
    await wait(50);
    check(focus.focused.startsWith(`${kind}:${kind === 'live' ? 'channel' : 'item'}:`), `${kind}: result unreachable after Back`);
    check(input.value === '123', `${kind}: search changed after Back`);
    focus.focus(`${kind}:search`); focus.select();
    check(document.activeElement === input, `${kind}: cannot reopen search`);
    reports.push({ kind, ...counts });
    render(null, root);
    await wait(0);
  }
  const config = { xtreamBaseUrl: 'https://provider.invalid:8080/custom', xtreamUsername: 'fixture', xtreamPassword: '', passwordConfigured: true, xmltvUrl: '', epgRefreshHours: 6, preferredLiveFormat: 'auto', autoplayLive: false, rememberLastChannel: true, demoMode: false, language: 'en', languageConfigured: true, configured: true };
  let resolveStatus, action;
  api.config = async () => ({ ...config });
  api.status = () => new Promise(resolve => { resolveStatus = resolve; });
  let saves = 0, tests = 0;
  api.saveConfig = async value => { saves++; Object.assign(config, value); return { ...config }; };
  api.testConfig = async value => { tests++; check(value.xtreamUsername === 'edited', 'Settings: test ignored draft'); return { ok: true, message: 'connected' }; };
  const stop = listenToRemote(value => action?.(value));
  function SettingsHarness() {
    focus = useFocusManager();
    return h(Settings, { language: 'en', setLanguage() {}, saved() {}, cleared() {}, leave() {}, registerAction(value) { action = value; } });
  }
  render(h(SettingsHarness), root); await wait(80);
  const select = async name => { focus.focus(`settings:${name}`); focus.select(); await wait(25); };
  const press = async key => { (document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true })); await wait(25); };
  await select('tab:provider'); await select('xtreamUsername');
  const input = root.querySelector('input[id="settings:xtreamUsername"]'); let blur = 0;
  input.addEventListener('blur', () => blur++);
  for (const value of ['e', 'ed', 'edi', 'edited']) {
    input.value = value; input.setSelectionRange(value.length, value.length); input.dispatchEvent(new Event('input', { bubbles: true }));
    if (resolveStatus) { resolveStatus({ version: '1.2.2' }); resolveStatus = null; }
    await wait(30);
    check(root.querySelector('input[id="settings:xtreamUsername"]') === input, 'Settings: input remounted');
    check(document.activeElement === input && input.selectionStart === value.length && input.value === value, 'Settings: input focus/cursor changed');
  }
  await press('Backspace'); check(document.activeElement === input && blur === 0, 'Settings: Backspace closed keyboard');
  const unexpectedBlur = blur;
  await press('Escape'); check(document.activeElement !== input, 'Settings: Back did not finish editing');
  await select('test'); check(tests === 1 && saves === 0, 'Settings: test persisted configuration');
  await select('save'); check(saves === 1 && root.textContent.includes('All changes saved'), 'Settings: save failed');
  await select('tab:data'); await select('clear-content');
  check(root.querySelector('[role=dialog]')?.textContent.includes('favorites, history, watch progress'), 'Settings: destructive scope missing');
  await press('Escape'); check(focus.focused === 'settings:clear-content', 'Settings: modal focus not restored');
  check(document.activeElement?.textContent.includes('Clear catalogs'), 'Settings: dialog did not restore DOM focus');
  for (const section of ['general', 'provider', 'playback', 'data']) {
    await select(`tab:${section}`);
    check(document.activeElement?.textContent === ({ general: 'General', provider: 'Provider & connection', playback: 'Playback', data: 'EPG & data' })[section], 'Settings: tab DOM focus lost');
    const form = root.querySelector('.settings-form').getBoundingClientRect();
    const footer = root.querySelector('.settings-save-bar').getBoundingClientRect();
    check(footer.bottom <= innerHeight && footer.top >= form.top && footer.width > 0, 'Settings: actions escaped safe area');
    check(root.querySelector('.settings-pane').clientHeight > 0, 'Settings: content collapsed');
  }
  await select('tab:provider');
  reports.push({ kind: 'settings', viewport: `${innerWidth}x${innerHeight}`, edits: 4, unexpectedBlur, saves, tests, dialogs: 'confirmed scope and restored focus', layout: 'all sections keep actions visible' });
  stop();
  return reports;
}
window.uiStability = { done: false };
run().then(reports => { window.uiStability = { done: true, reports }; })
  .catch(error => { window.uiStability = { done: true, error: error.message }; });
</script></html>
