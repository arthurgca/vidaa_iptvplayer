services:
  iptv:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DEMO_MODE
      - XTREAM_BASE_URL
      - XTREAM_USERNAME
      - XTREAM_PASSWORD
      - XMLTV_URL
      - EPG_REFRESH_HOURS
      - LANGUAGE
      - PREFERRED_LIVE_FORMAT
      - AUTOPLAY_LIVE
      - REMEMBER_LAST_CHANNEL
    volumes:
      - iptv_data:/data
    restart: unless-stopped

volumes:
  iptv_data:
    name: vidaa-iptv-data
